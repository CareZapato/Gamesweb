# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gamesweb
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: STATIC_DIR
        value: client/dist
      - key: ALLOWED_ORIGINS
        sync: false
