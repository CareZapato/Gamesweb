# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gamesweb
    runtime: node
    plan: free
    # --include=dev: Vite lives in devDependencies; do not set NODE_ENV=production at build time.
    # Client build is multi-page: portal, /realtournament/, /deadhold/ (see client/vite.config.ts).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
